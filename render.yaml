# Render Blueprint — one Web Service that builds the Vite site and serves it
# alongside the /api booking endpoint. Deploy via Render → New → Blueprint,
# pointing at this repo, then set the two Deskworks env vars in the dashboard.
services:
  - type: web
    name: jvo-events
    runtime: node
    # Free plan for now. NOTE: the free tier has an EPHEMERAL filesystem and no
    # persistent disk, and the service sleeps after ~15 min idle. The CBE vendor
    # data (server/cbe/data + uploads) therefore RESETS on every redeploy and
    # on cold starts. Fine for a first-draft/demo; move to a paid plan with a
    # mounted disk (and point CBE_DATA_FILE / CBE_UPLOAD_DIR at it) before this
    # holds real vendor records.
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DESKWORKS_API_KEY
        sync: false
      - key: DESKWORKS_BASE_URL
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DESKWORKS_CENTER_ID
        value: "6"
      - key: DESKWORKS_UNIT_ID
        value: "32"
      - key: DESKWORKS_IGNORE_WEEKDAYS
        value: "6"
      # Flip to "true" once a write-scoped Deskworks token + create endpoint
      # are in place. Until then the site runs calendar-only.
      - key: DESKWORKS_WRITE_ENABLED
        value: "false"
      # JotForm submission webhook → auto-book Deskworks + Google Calendar
      - key: JOTFORM_WEBHOOK_SECRET
        sync: false
      - key: JOTFORM_API_KEY
        sync: false
      # Booking confirmation email (SMTP). For Gmail, SMTP_PASS must be a
      # 16-char App Password, not the normal account password.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        sync: false
      # 30-day payment reminder sweep. Stays OFF until the Deskworks invoice
      # lookup (server/deskworksPayments.js) is wired up; while off it only
      # logs what it would send. Flip to "true" when ready.
      - key: PAYMENT_REMINDERS_ENABLED
        value: "false"
      # --- CBE Vendor Onboarding & Payment Tracking Platform ---
      # Optional. With none set, a built-in leadership login is used
      # (tieraholmes@spelman.edu / cbe2026). Set CBE_DEV_PASSWORD to change just
      # the password, or CBE_USERS (JSON) to define the full staff roster.
      # CBE_COGNITO_SECRET secures the Cognito webhook (unused for now).
      - key: CBE_DEV_PASSWORD
        sync: false
      - key: CBE_USERS
        sync: false
      - key: CBE_COGNITO_SECRET
        sync: false
