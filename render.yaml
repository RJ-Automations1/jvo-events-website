# Render Blueprint — one Web Service that builds the Vite site and serves it
# alongside the /api booking endpoint. Deploy via Render → New → Blueprint,
# pointing at this repo, then set the two Deskworks env vars in the dashboard.
services:
  - type: web
    name: jvo-events
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node server.js
    # Persistent disk for the booking-pipeline SQLite database (survives
    # deploys). Only this service gets it — the weddings-mode service shares
    # the codebase but doesn't run the pipeline.
    disk:
      name: jvo-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Event booking pipeline: SQLite on the persistent disk, staff dashboard
      # credentials (set in the dashboard — /admin answers 503 until they
      # exist), and the timeline-email kill switch (flip to "true" to start
      # sending the 45/30/15/14/3-day emails; while "false" the daily sweep
      # only logs what it would send).
      - key: DB_PATH
        value: "/data/jvo.db"
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PIPELINE_EMAILS_ENABLED
        value: "false"
      - key: DESKWORKS_API_KEY
        sync: false
      - key: DESKWORKS_BASE_URL
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DESKWORKS_CENTER_ID
        value: "6"
      - key: DESKWORKS_UNIT_ID
        value: "32"
      - key: DESKWORKS_IGNORE_WEEKDAYS
        value: "6"
      # Flip to "true" once a write-scoped Deskworks token + create endpoint
      # are in place. Until then the site runs calendar-only.
      - key: DESKWORKS_WRITE_ENABLED
        value: "false"
      # JotForm submission webhook → auto-book Deskworks + Google Calendar
      - key: JOTFORM_WEBHOOK_SECRET
        sync: false
      - key: JOTFORM_API_KEY
        sync: false
      # Booking confirmation email (SMTP). For Gmail, SMTP_PASS must be a
      # 16-char App Password, not the normal account password.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        sync: false
      # 30-day payment reminder sweep. Stays OFF until the Deskworks invoice
      # lookup (server/deskworksPayments.js) is wired up; while off it only
      # logs what it would send. Flip to "true" when ready.
      - key: PAYMENT_REMINDERS_ENABLED
        value: "false"
      # Website chatbot (POST /api/chat). Without this key the widget shows a
      # friendly "email/call us" fallback. Default model is claude-opus-4-8;
      # set CHAT_MODEL=claude-haiku-4-5 for a cheaper high-volume FAQ bot.
      - key: ANTHROPIC_API_KEY
        sync: false
      # ── Stripe invoicing ──────────────────────────────────────────────────
      # The deposit is still paid on Cheddar Up; Stripe bills the balance.
      # An invoice is created and emailed automatically the moment a booking
      # form arrives — events for the full rental price (the $150 deposit is
      # refundable and separate), weddings for their total minus the $500
      # deposit (non-refundable, credited to the balance).
      # SECRET — set in the Render dashboard. Without it no invoice is sent and
      # the booking still records normally.
      - key: STRIPE_SECRET_KEY
        sync: false
      # Days the customer gets to pay once the invoice lands. Default 7.
      - key: INVOICE_DAYS_UNTIL_DUE
        value: "7"
      # The weddings registration form. Point its JotForm webhook at
      # /api/jotform-hook (same shared token) or weddings bookings never reach
      # the server and no wedding invoice is ever sent.
      - key: JOTFORM_WEDDINGS_FORM_ID
        value: "261945498570168"
      # Sends the nav's "Weddings" link to the standalone JVO Weddings site
      # instead of the in-app /weddings page. Swap in a custom wedding domain
      # when one is mapped. NOTE: VITE_* vars are baked in at BUILD time, so a
      # change here only takes effect after a redeploy.
      - key: VITE_WEDDINGS_URL
        value: "https://jvo-weddings.onrender.com"

  # Standalone "JVO Weddings" site. Same codebase and server as jvo-events, but
  # SITE_MODE=weddings makes the root land on the Weddings page — so this gets
  # its own onrender.com URL now and a custom wedding domain can be mapped later.
  # Secrets are sync:false: enter them (or copy from jvo-events) when the
  # blueprint syncs. The Weddings page itself only needs the app to build; the
  # rest are shared so booking/chat still work if a visitor navigates the site.
  - type: web
    name: jvo-weddings
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: SITE_MODE
        value: "weddings"
      # Build-time flag that makes this deployment a STANDALONE weddings site:
      # wedding-only nav/footer, weddings page at the root, no events pages.
      # VITE_* is baked in at build time, so changes need a redeploy.
      - key: VITE_SITE_MODE
        value: "weddings"
      - key: NODE_VERSION
        value: "24"
      - key: DESKWORKS_API_KEY
        sync: false
      - key: DESKWORKS_BASE_URL
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DESKWORKS_CENTER_ID
        value: "6"
      - key: DESKWORKS_UNIT_ID
        value: "32"
      - key: DESKWORKS_IGNORE_WEEKDAYS
        value: "6"
      - key: DESKWORKS_WRITE_ENABLED
        value: "false"
      - key: JOTFORM_WEBHOOK_SECRET
        sync: false
      - key: JOTFORM_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        sync: false
      - key: PAYMENT_REMINDERS_ENABLED
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false
      # ── Stripe invoicing ──────────────────────────────────────────────────
      # The deposit is still paid on Cheddar Up; Stripe bills the balance.
      # An invoice is created and emailed automatically the moment a booking
      # form arrives — events for the full rental price (the $150 deposit is
      # refundable and separate), weddings for their total minus the $500
      # deposit (non-refundable, credited to the balance).
      # SECRET — set in the Render dashboard. Without it no invoice is sent and
      # the booking still records normally.
      - key: STRIPE_SECRET_KEY
        sync: false
      # Days the customer gets to pay once the invoice lands. Default 7.
      - key: INVOICE_DAYS_UNTIL_DUE
        value: "7"
      # The weddings registration form. Point its JotForm webhook at
      # /api/jotform-hook (same shared token) or weddings bookings never reach
      # the server and no wedding invoice is ever sent.
      - key: JOTFORM_WEDDINGS_FORM_ID
        value: "261945498570168"
